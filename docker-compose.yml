services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gradientrush-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradientrush
      POSTGRES_PASSWORD: gradientrush_dev
      POSTGRES_DB: knowledge_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
